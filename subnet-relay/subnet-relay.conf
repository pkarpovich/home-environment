# Relay mappings: <proto> <alias-ip> <device-ip> <port>[,<port>...]  # device name
#
# proto      - tcp or udp.
# alias-ip   - a free address in the DEVICE subnet (192.168.199.x), taken over by
#              this host; Home Assistant is pointed at this address and never
#              needs to change afterwards.
# device-ip  - the current DHCP address of the device.
#
# A two-field line "<alias-ip> <device-ip>" is shorthand for udp/54321 (miio).
#
# After editing:  sudo systemctl restart subnet-relay
# Adding a device or changing an IP is a one-line edit here - see README.md.

udp 192.168.199.201 192.168.199.101 54321   # Xiaomi Smart Air Purifier 4 Pro (zhimi.airp.vb4)
udp 192.168.199.202 192.168.199.26  54321   # Smartmi Standing Fan 3 (zhimi.fan.za5)

tcp 192.168.199.203 192.168.199.39  8001,8002,9197   # Samsung UE55TU7022KXXH ([TV] Samsung 7 Series (55))
