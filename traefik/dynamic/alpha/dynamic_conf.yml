http:
  routers:
    nas-router:
      rule: "Host(`nas.{{env "ROOT_DOMAIN"}}`)"
      entryPoints: [ "https" ]
      service: "nas-service"
      tls:
        certResolver: le

    plex-router:
      rule: "Host(`plex.{{env "ROOT_DOMAIN"}}`)"
      entryPoints: [ "https" ]
      service: "plex-service"
      tls:
        certResolver: le

    qbittorrent-router:
      rule: "Host(`torrents.{{env "ROOT_DOMAIN"}}`)"
      entryPoints: [ "https" ]
      service: "qbittorrent-service"
      tls:
        certResolver: le

    flood-router:
      rule: "Host(`torrents-ui.{{env "ROOT_DOMAIN"}}`)"
      entryPoints: [ "https" ]
      service: "flood-service"
      tls:
        certResolver: le

    homeassistant-router:
      rule: "Host(`homeassistant.{{env "ROOT_DOMAIN"}}`)"
      entryPoints: [ "https" ]
      service: "homeassistant-service"
      tls:
        certResolver: le

    tuclaw-router:
      rule: "Host(`tuclaw.{{env "ROOT_DOMAIN"}}`)"
      entryPoints: [ "https" ]
      service: "tuclaw-service"
      tls:
        certResolver: le

    ralphex-farm-router:
      rule: "Host(`ralphex-farm.{{env "ROOT_DOMAIN"}}`)"
      entryPoints: [ "https" ]
      service: "ralphex-farm-service"
      tls:
        certResolver: le

  services:
    nas-service:
      loadBalancer:
        servers:
          - url: "{{env "NAS_URL"}}"

    plex-service:
      loadBalancer:
        servers:
          - url: "{{env "PLEX_URL"}}"

    qbittorrent-service:
      loadBalancer:
        servers:
          - url: "{{env "TORRENT_URL"}}"

    flood-service:
      loadBalancer:
        servers:
          - url: "{{env "TORRENT_UI_URL"}}"

    homeassistant-service:
      loadBalancer:
        servers:
          - url: "{{env "HOMEASSISTANT_URL"}}"

    tuclaw-service:
      loadBalancer:
        servers:
          - url: "http://192.168.199.72:9090"

    ralphex-farm-service:
      loadBalancer:
        servers:
          - url: "http://192.168.199.72:7077"
