services:
  linkding:
    image: sissbruecker/linkding:latest
    container_name: linkding
    restart: unless-stopped
    healthcheck:
      interval: 5m
      start_period: 90s
      start_interval: 5s
    expose:
      - 9090
    volumes:
      - ./volumes/linkding:/etc/linkding/data
    environment:
      - LD_SUPERUSER_NAME=${LINKDING_SUPERUSER_NAME}
      - LD_SUPERUSER_PASSWORD=${LINKDING_SUPERUSER_PASSWORD}
      - LD_ENABLE_OIDC=true
      - LD_CSRF_TRUSTED_ORIGINS=https://bookmarks.${ROOT_DOMAIN},https://auth.${ROOT_DOMAIN}
      - OIDC_RP_CLIENT_ID=linkding
      - OIDC_RP_CLIENT_SECRET=${LINKDING_OIDC_CLIENT_SECRET}
      - OIDC_OP_AUTHORIZATION_ENDPOINT=https://auth.${ROOT_DOMAIN}/api/oidc/authorization
      - OIDC_OP_TOKEN_ENDPOINT=https://auth.${ROOT_DOMAIN}/api/oidc/token
      - OIDC_OP_USER_ENDPOINT=https://auth.${ROOT_DOMAIN}/api/oidc/userinfo
      - OIDC_OP_JWKS_ENDPOINT=https://auth.${ROOT_DOMAIN}/jwks.json
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.linkding.rule=Host(`bookmarks.${ROOT_DOMAIN}`)"
      - "traefik.http.routers.linkding.entrypoints=https"
      - "traefik.http.routers.linkding.tls.certresolver=le"
    depends_on:
      - traefik
