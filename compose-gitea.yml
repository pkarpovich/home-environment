services:
  gitea:
    container_name: gitea
    image: gitea/gitea:1.27.0
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA_CUSTOM=/data/gitea
      - TZ=Europe/Warsaw
    volumes:
      - /srv/gitea:/data
    ports:
      - "4022:22"
    expose:
      - 3000
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/healthz"]
      interval: 5m
      timeout: 10s
      start_period: 90s
      start_interval: 5s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gitea.rule=Host(`git.${ROOT_DOMAIN}`)"
      - "traefik.http.routers.gitea.entrypoints=https"
      - "traefik.http.routers.gitea.tls.certresolver=le"
      - "traefik.http.services.gitea.loadbalancer.server.port=3000"

networks:
  proxy:
    external: true
