theme: 'auto'

server:
  address: 'tcp://:9091/'
  endpoints:
    authz:
      forward-auth:
        implementation: 'ForwardAuth'

log:
  level: 'info'

webauthn:
  enable_passkey_login: true
  display_name: '{{ mustEnv "ROOT_DOMAIN" }}'
  selection_criteria:
    discoverability: 'required'
    user_verification: 'required'

authentication_backend:
  password_reset:
    disable: true
  password_change:
    disable: true
  file:
    path: '/config/users_database.yml'
    watch: true

access_control:
  default_policy: 'one_factor'
  rules:
    - domain: 'info.{{ mustEnv "ROOT_DOMAIN" }}'
      policy: 'two_factor'

session:
  redis:
    host: 'authelia-redis'
    port: 6379
  cookies:
    - domain: '{{ mustEnv "ROOT_DOMAIN" }}'
      authelia_url: 'https://auth.{{ mustEnv "ROOT_DOMAIN" }}'
      default_redirection_url: 'https://home.{{ mustEnv "ROOT_DOMAIN" }}'
      inactivity: '1h'
      expiration: '12h'
      remember_me: '1M'

identity_providers:
  oidc:
    jwks:
      - key: {{ secret "/config/secrets/oidc.pem" | mindent 10 "|" | msquote }}
    lifespans:
      custom:
        machine:
          grants:
            client_credentials:
              access_token: '15m'
    claims_policies:
      grafana:
        id_token:
          - 'email'
          - 'name'
          - 'groups'
          - 'preferred_username'
      ryot:
        id_token:
          - 'email'
    clients:
      - client_id: 'gitea'
        client_name: 'Gitea'
        client_secret: '{{ secret "/config/secrets/gitea.client_secret" }}'
        public: false
        authorization_policy: 'one_factor'
        consent_mode: 'implicit'
        redirect_uris:
          - 'https://git.{{ mustEnv "ROOT_DOMAIN" }}/user/oauth2/authelia/callback'
        scopes:
          - 'openid'
          - 'email'
          - 'profile'
          - 'groups'
        response_types:
          - 'code'
        grant_types:
          - 'authorization_code'
        access_token_signed_response_alg: 'none'
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'client_secret_basic'
      - client_id: 'grafana'
        client_name: 'Grafana'
        client_secret: '{{ secret "/config/secrets/grafana.client_secret" }}'
        public: false
        authorization_policy: 'one_factor'
        consent_mode: 'implicit'
        claims_policy: 'grafana'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris:
          - 'https://grafana.{{ mustEnv "ROOT_DOMAIN" }}/login/generic_oauth'
        scopes:
          - 'openid'
          - 'profile'
          - 'groups'
          - 'email'
        response_types:
          - 'code'
        grant_types:
          - 'authorization_code'
        access_token_signed_response_alg: 'none'
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'client_secret_basic'
      - client_id: 'linkding'
        client_name: 'Linkding'
        client_secret: '{{ secret "/config/secrets/linkding.client_secret" }}'
        public: false
        authorization_policy: 'one_factor'
        consent_mode: 'implicit'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris:
          - 'https://bookmarks.{{ mustEnv "ROOT_DOMAIN" }}/oidc/callback/'
        scopes:
          - 'openid'
          - 'email'
          - 'profile'
        response_types:
          - 'code'
        grant_types:
          - 'authorization_code'
        access_token_signed_response_alg: 'none'
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'client_secret_post'
      - client_id: 'ryot'
        client_name: 'Ryot'
        client_secret: '{{ secret "/config/secrets/ryot.client_secret" }}'
        public: false
        authorization_policy: 'one_factor'
        consent_mode: 'implicit'
        claims_policy: 'ryot'
        redirect_uris:
          - 'https://ryot.{{ mustEnv "ROOT_DOMAIN" }}/api/auth'
        scopes:
          - 'openid'
          - 'email'
        response_types:
          - 'code'
        grant_types:
          - 'authorization_code'
        access_token_signed_response_alg: 'none'
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'client_secret_basic'
      - client_id: 'hub-reminders'
        client_name: 'turtle-hub reminders'
        public: false
        grant_types:
          - 'client_credentials'
        scopes:
          - 'bridge:reminders.read'
          - 'bridge:reminders.write'
        audience:
          - 'https://eventkit-bridge'
        requested_audience_mode: 'explicit'
        token_endpoint_auth_method: 'private_key_jwt'
        token_endpoint_auth_signing_alg: 'RS256'
        introspection_endpoint_auth_method: 'private_key_jwt'
        introspection_endpoint_auth_signing_alg: 'RS256'
        revocation_endpoint_auth_method: 'private_key_jwt'
        revocation_endpoint_auth_signing_alg: 'RS256'
        pushed_authorization_request_endpoint_auth_method: 'private_key_jwt'
        pushed_authorization_request_endpoint_auth_signing_alg: 'RS256'
        jwks:
          - key_id: 'hub-reminders-2026-10-07'
            algorithm: 'RS256'
            use: 'sig'
            key: {{ secret "/config/secrets/hub-reminders.pub" | mindent 14 "|" | msquote }}
        access_token_signed_response_alg: 'RS256'
        lifespan: 'machine'
      - client_id: 'hub-calendar'
        client_name: 'turtle-hub calendar'
        public: false
        grant_types:
          - 'client_credentials'
        scopes:
          - 'bridge:calendar.read'
          - 'bridge:calendar.write'
        audience:
          - 'https://eventkit-bridge'
        requested_audience_mode: 'explicit'
        token_endpoint_auth_method: 'private_key_jwt'
        token_endpoint_auth_signing_alg: 'RS256'
        introspection_endpoint_auth_method: 'private_key_jwt'
        introspection_endpoint_auth_signing_alg: 'RS256'
        revocation_endpoint_auth_method: 'private_key_jwt'
        revocation_endpoint_auth_signing_alg: 'RS256'
        pushed_authorization_request_endpoint_auth_method: 'private_key_jwt'
        pushed_authorization_request_endpoint_auth_signing_alg: 'RS256'
        jwks:
          - key_id: 'hub-calendar-2026-10-07'
            algorithm: 'RS256'
            use: 'sig'
            key: {{ secret "/config/secrets/hub-calendar.pub" | mindent 14 "|" | msquote }}
        access_token_signed_response_alg: 'RS256'
        lifespan: 'machine'
      - client_id: 'hub-mail'
        client_name: 'turtle-hub mail'
        public: false
        grant_types:
          - 'client_credentials'
        scopes:
          - 'bridge:mail.read'
          - 'bridge:mail.junk'
        audience:
          - 'https://eventkit-bridge'
        requested_audience_mode: 'explicit'
        token_endpoint_auth_method: 'private_key_jwt'
        token_endpoint_auth_signing_alg: 'RS256'
        introspection_endpoint_auth_method: 'private_key_jwt'
        introspection_endpoint_auth_signing_alg: 'RS256'
        revocation_endpoint_auth_method: 'private_key_jwt'
        revocation_endpoint_auth_signing_alg: 'RS256'
        pushed_authorization_request_endpoint_auth_method: 'private_key_jwt'
        pushed_authorization_request_endpoint_auth_signing_alg: 'RS256'
        jwks:
          - key_id: 'hub-mail-2026-10-07'
            algorithm: 'RS256'
            use: 'sig'
            key: {{ secret "/config/secrets/hub-mail.pub" | mindent 14 "|" | msquote }}
        access_token_signed_response_alg: 'RS256'
        lifespan: 'machine'

storage:
  local:
    path: '/data/db.sqlite3'

notifier:
  filesystem:
    filename: '/data/notification.txt'
