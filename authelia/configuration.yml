theme: 'auto'

server:
  address: 'tcp://:9091/'
  endpoints:
    authz:
      forward-auth:
        implementation: 'ForwardAuth'

log:
  level: 'info'

webauthn:
  enable_passkey_login: true
  display_name: '{{ mustEnv "ROOT_DOMAIN" }}'
  selection_criteria:
    discoverability: 'required'
    user_verification: 'required'

authentication_backend:
  password_reset:
    disable: true
  password_change:
    disable: true
  file:
    path: '/config/users_database.yml'
    watch: true

access_control:
  default_policy: 'one_factor'
  rules:
    - domain: 'info.{{ mustEnv "ROOT_DOMAIN" }}'
      policy: 'two_factor'

session:
  redis:
    host: 'authelia-redis'
    port: 6379
  cookies:
    - domain: '{{ mustEnv "ROOT_DOMAIN" }}'
      authelia_url: 'https://auth.{{ mustEnv "ROOT_DOMAIN" }}'
      default_redirection_url: 'https://home.{{ mustEnv "ROOT_DOMAIN" }}'
      inactivity: '1h'
      expiration: '12h'
      remember_me: '1M'

identity_providers:
  oidc:
    jwks:
      - key: {{ secret "/config/secrets/oidc.pem" | mindent 10 "|" | msquote }}
    clients:
      - client_id: 'gitea'
        client_name: 'Gitea'
        client_secret: '{{ secret "/config/secrets/gitea.client_secret" }}'
        public: false
        authorization_policy: 'one_factor'
        consent_mode: 'implicit'
        redirect_uris:
          - 'https://git.{{ mustEnv "ROOT_DOMAIN" }}/user/oauth2/authelia/callback'
        scopes:
          - 'openid'
          - 'email'
          - 'profile'
          - 'groups'
        response_types:
          - 'code'
        grant_types:
          - 'authorization_code'
        access_token_signed_response_alg: 'none'
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'client_secret_basic'

storage:
  local:
    path: '/data/db.sqlite3'

notifier:
  filesystem:
    filename: '/data/notification.txt'
