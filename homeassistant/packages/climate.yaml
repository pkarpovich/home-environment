template:
  # Tells what to do with the two balcony doors - one advice for both rooms,
  # since they share the same balcony wall. The balcony sensor sits in the sun,
  # so around midday it reports its own heated casing (69.8 C on 5 Aug, while the
  # air was nowhere near that) instead of the air. That absolute number is
  # useless, but comparing it with the rooms still points the right way and errs
  # towards "close", which is the safe direction here. The reference is the
  # COOLER of the two rooms: letting heat into the colder one costs more than
  # missing a little cooling in the warmer.
  # The state is the action rather than the physics - it asks for something only
  # while the doors are actually in the wrong position, so doing what it says
  # clears it and no separate hysteresis is needed. The 0.3 margin on the opening
  # side, and 0.2 on the closing one, stop it reacting to a fraction of a
  # degree: without the second margin the two curves cross back and forth for
  # a few minutes at dawn and the advice flickers (3 changes in 4 min on 3 Aug).
  - sensor:
      - name: "Balcony airing"
        unique_id: balcony_airing_advice
        icon: mdi:door-sliding
        availability: >
          {{ states('sensor.eve_weather_20ebs9901_temperature') | is_number
             and states('sensor.eve_weather_lr_temperature') | is_number
             and states('sensor.bedroom_eve_weather_bedroom_temperature') | is_number }}
        state: >
          {% set balcony = states('sensor.eve_weather_20ebs9901_temperature') | float %}
          {% set coolest = [states('sensor.eve_weather_lr_temperature') | float,
                            states('sensor.bedroom_eve_weather_bedroom_temperature') | float] | min %}
          {% set open_doors = (1 if is_state('binary_sensor.balcony_door_lr', 'on') else 0)
                            + (1 if is_state('binary_sensor.balcony_door_bedroom', 'on') else 0) %}
          {% if open_doors > 0 and balcony > coolest + 0.2 %}close
          {% elif open_doors < 2 and balcony < coolest - 0.3 %}open
          {% else %}ok{% endif %}
        attributes:
          balcony: >
            {{ states('sensor.eve_weather_20ebs9901_temperature') | float | round(1) }}
          living_room: >
            {{ states('sensor.eve_weather_lr_temperature') | float | round(1) }}
          bedroom: >
            {{ states('sensor.bedroom_eve_weather_bedroom_temperature') | float | round(1) }}
          reference_room: >
            {% set lr = states('sensor.eve_weather_lr_temperature') | float %}
            {% set bed = states('sensor.bedroom_eve_weather_bedroom_temperature') | float %}
            {{ 'bedroom' if bed <= lr else 'living_room' }}
          margin: >
            {% set balcony = states('sensor.eve_weather_20ebs9901_temperature') | float %}
            {% set coolest = [states('sensor.eve_weather_lr_temperature') | float,
                              states('sensor.bedroom_eve_weather_bedroom_temperature') | float] | min %}
            {{ (coolest - balcony) | round(1) }}
          door_living_room: >
            {{ states('binary_sensor.balcony_door_lr') }}
          door_bedroom: >
            {{ states('binary_sensor.balcony_door_bedroom') }}
          asleep: >
            {{ is_state('input_boolean.asleep', 'on') }}

  # Outside temperature as a plain recorded number, so the statistics platform can
  # average it. met.no rather than the balcony sensor: that one sits in direct sun
  # and reports its own casing - 69.8 C on 5 Aug.
  - sensor:
      - name: "Outdoor temperature"
        unique_id: outdoor_temperature
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: >
          {{ state_attr('weather.forecast_home', 'temperature') is not none }}
        state: >
          {{ state_attr('weather.forecast_home', 'temperature') | float }}

# Whether the building is delivering heat. The district-heating substation starts
# and stops on its own and cannot be read from here, and outside temperature is a
# poor stand-in for it: in 2026 a warm week switched a weather-based season off on
# 28 Sep and kept every valve shut until 11 Oct, while the flat went cold. So the
# radiator itself is the witness - see the Heating probe automation. The flag keeps
# its state across restarts (no initial: on purpose).
input_boolean:
  building_heating:
    name: Building heating
    icon: mdi:radiator
  heating_probe_today:
    name: Heating probe today
    icon: mdi:thermometer-check

# The bathroom TRV reading at 07:00, before its valve opens at 08:00, and the
# highest reading since. Their difference is the probe's answer.
input_number:
  heating_probe_baseline:
    name: Heating probe baseline
    min: -10
    max: 60
    step: 0.1
    unit_of_measurement: "°C"
    mode: box
  heating_probe_peak:
    name: Heating probe peak
    min: -10
    max: 60
    step: 0.1
    unit_of_measurement: "°C"
    mode: box

counter:
  heating_cold_mornings:
    name: Heating cold mornings
    icon: mdi:radiator-off

script:
  # Puts every radiator where the schedule says it should be right now, and moves a
  # valve only when it is not already there - an Eve Thermo motor is audible, and
  # re-sending the same state still makes it run. Living room and bathroom heat
  # 08:00-22:00; the bedroom from getting up (sleep_mode off) until 22:00, with 05:00
  # as the earliest so the 00:00-00:20 gap before sleep_mode switches on cannot warm
  # it; an open balcony door keeps that room's radiator off. Without the
  # building_heating flag it touches nothing at all.
  heating_apply_schedule:
    alias: Heating - apply schedule
    mode: queued
    sequence:
      - condition: state
        entity_id: input_boolean.building_heating
        state: "on"
      - variables:
          day: "{{ today_at('08:00') <= now() < today_at('22:00') }}"
          bedroom_day: >
            {{ is_state('input_boolean.sleep_mode', 'off')
               and today_at('05:00') <= now() < today_at('22:00') }}
          want:
            climate.eve_thermo_20ebp1701_3: "{{ day and is_state('binary_sensor.balcony_door_lr', 'off') }}"
            climate.eve_thermo_20ebp1701_4: "{{ day and is_state('binary_sensor.balcony_door_lr', 'off') }}"
            climate.eve_thermo_20ebp1701: "{{ day }}"
            climate.eve_thermo_20ebp1701_2: "{{ bedroom_day and is_state('binary_sensor.balcony_door_bedroom', 'off') }}"
      - repeat:
          for_each: "{{ want | list }}"
          sequence:
            - if:
                - condition: template
                  value_template: "{{ want[repeat.item] | bool }}"
              then:
                - if:
                    - condition: template
                      value_template: >
                        {{ not is_state(repeat.item, 'heat')
                           or state_attr(repeat.item, 'temperature') | float(0) != 30 }}
                  then:
                    - action: climate.set_temperature
                      target:
                        entity_id: "{{ repeat.item }}"
                      data:
                        hvac_mode: heat
                        temperature: 30
              else:
                - if:
                    - condition: template
                      value_template: "{{ not is_state(repeat.item, 'off') }}"
                  then:
                    - action: climate.set_hvac_mode
                      target:
                        entity_id: "{{ repeat.item }}"
                      data:
                        hvac_mode: "off"
