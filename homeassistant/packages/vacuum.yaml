# Room picking for the Roborock dashboard view. Each room is a switch; the order rooms
# are switched on in is kept in input_text.vacuum_room_order, and the clean script
# hands that list to vacuum.clean_area, which passes it on to the robot in the same
# order. Room ids are the Home Assistant areas the robot's segments are mapped to.

input_boolean:
  vacuum_room_corridor:
    name: Vacuum room Hall
    icon: mdi:door
  vacuum_room_kitchen:
    name: Vacuum room Kitchen
    icon: mdi:silverware-fork-knife
  vacuum_room_living_room:
    name: Vacuum room Living Room
    icon: mdi:sofa
  vacuum_room_bedroom:
    name: Vacuum room Bedroom
    icon: mdi:bed
  vacuum_room_bathroom:
    name: Vacuum room Bathroom
    icon: mdi:shower

input_text:
  vacuum_room_order:
    name: Vacuum room order
    max: 255

automation:
  - id: '1785900000001'
    alias: Vacuum - remember room order
    description: Keeps input_text.vacuum_room_order in the order the room switches were
      turned on, so the robot cleans the rooms in the order they were picked.
    mode: queued
    triggers:
      - trigger: state
        entity_id:
          - input_boolean.vacuum_room_corridor
          - input_boolean.vacuum_room_kitchen
          - input_boolean.vacuum_room_living_room
          - input_boolean.vacuum_room_bedroom
          - input_boolean.vacuum_room_bathroom
        to:
          - 'on'
          - 'off'
    actions:
      - variables:
          room: "{{ trigger.entity_id | replace('input_boolean.vacuum_room_', '') }}"
          current: "{{ states('input_text.vacuum_room_order') | replace('unknown', '') }}"
          rooms: "{{ current.split(',') | reject('eq', '') | reject('eq', room) | list }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.vacuum_room_order
        data:
          value: "{{ (rooms + ([room] if trigger.to_state.state == 'on' else [])) | join(',') }}"

script:
  vacuum_clean_selected:
    alias: Vacuum - clean selected rooms
    icon: mdi:robot-vacuum
    mode: single
    description: Cleans the picked rooms in the order they were picked, then clears the
      selection. Does nothing when no room is picked.
    sequence:
      - variables:
          rooms: "{{ states('input_text.vacuum_room_order').split(',') | reject('in', ['', 'unknown']) | list }}"
      - condition: template
        value_template: "{{ rooms | count > 0 }}"
      - action: vacuum.clean_area
        target:
          entity_id: vacuum.roborock_qrevo_curv
        data:
          cleaning_area_id: "{{ rooms }}"
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.vacuum_room_corridor
            - input_boolean.vacuum_room_kitchen
            - input_boolean.vacuum_room_living_room
            - input_boolean.vacuum_room_bedroom
            - input_boolean.vacuum_room_bathroom
