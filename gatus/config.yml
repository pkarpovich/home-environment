ui:
  dashboard-heading: Turtle Home
  default-sort-by: group

alerting:
  telegram:
    token: ${TELEGRAM_TOKEN}
    id: ${TELEGRAM_CHAT_ID}
    default-alert:
      enabled: true
      failure-threshold: 3
      success-threshold: 2
      minimum-reminder-interval: 8h
      send-on-resolved: true

external-endpoints:
  - name: Time Machine MBP-2021
    group: Backups
    token: "${TM_MBP_2021_TOKEN}"
    heartbeat:
      interval: 48h
    alerts:
      - type: telegram
        failure-threshold: 1
        success-threshold: 1

  - name: Time Machine MBA-2022
    group: Backups
    token: "${TM_MBA_2022_TOKEN}"
    heartbeat:
      interval: 48h
    alerts:
      - type: telegram
        failure-threshold: 1
        success-threshold: 1

  - name: restic-alpha
    group: Backups
    token: "${RESTIC_ALPHA_TOKEN}"
    heartbeat:
      interval: 26h
    alerts:
      - type: telegram
        failure-threshold: 1
        success-threshold: 1

  - name: restic-bravo
    group: Backups
    token: "${RESTIC_BRAVO_TOKEN}"
    heartbeat:
      interval: 26h
    alerts:
      - type: telegram
        failure-threshold: 1
        success-threshold: 1

  - name: restic-offsite
    group: Backups
    token: "${RESTIC_OFFSITE_TOKEN}"
    heartbeat:
      interval: 26h
    alerts:
      - type: telegram
        failure-threshold: 1
        success-threshold: 1

  - name: fs-alpha
    group: Infrastructure
    token: "${FS_ALPHA_TOKEN}"
    heartbeat:
      interval: 15m
    alerts:
      - type: telegram
        failure-threshold: 1
        success-threshold: 1

  - name: fs-bravo
    group: Infrastructure
    token: "${FS_BRAVO_TOKEN}"
    heartbeat:
      interval: 15m
    alerts:
      - type: telegram
        failure-threshold: 1
        success-threshold: 1

  - name: backup-audit-alpha
    group: Backups
    token: "${AUDIT_ALPHA_TOKEN}"
    heartbeat:
      interval: 192h
    alerts:
      - type: telegram
        failure-threshold: 1
        success-threshold: 1

  - name: backup-audit-bravo
    group: Backups
    token: "${AUDIT_BRAVO_TOKEN}"
    heartbeat:
      interval: 192h
    alerts:
      - type: telegram
        failure-threshold: 1
        success-threshold: 1

endpoints:
  # Infrastructure
  - name: Zima Pi
    group: Infrastructure
    url: "icmp://192.168.198.3"
    interval: 1m
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: telegram

  - name: Gitea
    group: Infrastructure
    url: "https://git.pkarpovich.space/api/healthz"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == pass"
    alerts:
      - type: telegram

  - name: DERP
    group: Infrastructure
    url: "https://derp.pkarpovich.dev/derp/probe"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: telegram

  - name: NATS
    group: Infrastructure
    url: "http://nats:8222/healthz"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
    alerts:
      - type: telegram

  - name: SeaweedFS S3
    group: Infrastructure
    url: "http://seaweedfs:8333/"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: telegram

  - name: pkarpovich.space DNS
    group: Infrastructure
    url: "1.1.1.1"
    interval: 5m
    dns:
      query-name: "pkarpovich.space"
      query-type: "A"
    conditions:
      - "[DNS_RCODE] == NOERROR"
    alerts:
      - type: telegram

  - name: Turtle's relay (SMTP)
    group: Infrastructure
    url: "tcp://192.168.198.3:2525"
    interval: 1m
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: telegram

  # Smart Home
  - name: Home Assistant Devices
    group: Smart Home
    url: "http://${HA_HOST}:8123/api/states/sensor.unavailable_devices_count"
    interval: 5m
    headers:
      Authorization: "Bearer ${HA_TOKEN}"
    conditions:
      - "[STATUS] == 200"
      - "[BODY].state == 0"
    alerts:
      - type: telegram

  # Local Services
  - name: Turtle Harbor Pi
    group: Local
    url: "http://192.168.198.3:9200/health"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: telegram

  - name: Tuclaw
    group: Local
    url: "http://192.168.199.72:9090/health"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
      - "[BODY].docker == ok"
      - "[BODY].agents == ok"
    alerts:
      - type: telegram

  - name: Slow Reader
    group: Local
    url: "http://slowreader:2554/health"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == OK"
    alerts:
      - type: telegram

  # Fails both when VictoriaMetrics is down and when its scrape of Home Assistant
  # breaks (HA down, or the HA_PROMETHEUS_TOKEN revoked), since up{} is 0 then.
  - name: Home sensors (VictoriaMetrics)
    group: Local
    url: "http://victoriametrics:8428/api/v1/query?query=up%7Bjob%3D%22homeassistant%22%7D"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].data.result[0].value[1] == 1"
    alerts:
      - type: telegram

  # Turtle Hub
  # The wildcard cert for *.pkarpovich.space is already asserted by the External
  # group, so these endpoints skip CERTIFICATE_EXPIRATION to avoid ten identical
  # alerts firing at once when it nears expiry.
  - name: Boosty
    group: Turtle Hub
    url: "https://boosty.pkarpovich.space/healthz"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
    alerts:
      - type: telegram

  - name: Streamcast
    group: Turtle Hub
    url: "https://streamcast.pkarpovich.space/healthz"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: telegram

  - name: Stream Recorder
    group: Turtle Hub
    url: "https://stream-recorder.pkarpovich.space/healthz"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].healthy == true"
    alerts:
      - type: telegram

  - name: Stream Recorder MCP
    group: Turtle Hub
    url: "https://stream-recorder.pkarpovich.space/mcp"
    method: POST
    headers:
      Content-Type: application/json
    body: '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}'
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "len([BODY].result.tools) > 0"
    alerts:
      - type: telegram

  - name: Streamcast Twitch resolve
    group: Turtle Hub
    url: "https://streamcast.pkarpovich.space/resolve"
    method: POST
    headers:
      Content-Type: application/json
    body: '{"channels":[{"channel":"twitch","source":"twitch"}]}'
    interval: 10m
    client:
      timeout: 60s
    conditions:
      - "[STATUS] == 200"
      - "len([BODY].failed) == 0"
    alerts:
      - type: telegram

  - name: Plex MCP
    group: Turtle Hub
    url: "https://plex-mcp.pkarpovich.space/mcp"
    method: POST
    headers:
      Content-Type: application/json
    body: '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}'
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "len([BODY].result.tools) > 0"
    alerts:
      - type: telegram

  - name: Trakt MCP
    group: Turtle Hub
    url: "https://trakt-mcp.pkarpovich.space/mcp"
    method: POST
    headers:
      Content-Type: application/json
    body: '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}'
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "len([BODY].result.tools) > 0"
    alerts:
      - type: telegram

  - name: Telegram User MCP
    group: Turtle Hub
    url: "https://telegram-user-mcp.pkarpovich.space/healthz"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].authorized == true"
    alerts:
      - type: telegram

  - name: Telegram User MCP tools
    group: Turtle Hub
    url: "https://telegram-user-mcp.pkarpovich.space/mcp"
    method: POST
    headers:
      Content-Type: application/json
    body: '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}'
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "len([BODY].result.tools) > 0"
    alerts:
      - type: telegram

  - name: WhatsApp Monitor MCP
    group: Turtle Hub
    url: "https://whatsapp-monitor-mcp.pkarpovich.space/healthz"
    interval: 2m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].is_linked == true"
      - "[BODY].is_connected == true"
    alerts:
      - type: telegram
        failure-threshold: 5

  - name: WhatsApp Monitor MCP tools
    group: Turtle Hub
    url: "https://whatsapp-monitor-mcp.pkarpovich.space/mcp"
    method: POST
    headers:
      Content-Type: application/json
    body: '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}'
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "len([BODY].result.tools) > 0"
    alerts:
      - type: telegram

  - name: Twitch
    group: Turtle Hub
    url: "https://turtle-hub.pkarpovich.space/twitch/healthz"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
    alerts:
      - type: telegram

  - name: YouTube
    group: Turtle Hub
    url: "https://youtube.pkarpovich.space/healthz"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
    alerts:
      - type: telegram

  - name: Overcast
    group: Turtle Hub
    url: "https://overcast.pkarpovich.space/healthz"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
    alerts:
      - type: telegram

  - name: Oura
    group: Turtle Hub
    url: "https://oura.pkarpovich.space/healthz"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status != failed"
      - "[BODY].auth.authorized == true"
      - "[BODY].ageSeconds < 7200"
    alerts:
      - type: telegram

  - name: Obsidian Sync
    group: Turtle Hub
    url: "http://obsidian-sync:8080/healthz"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
    alerts:
      - type: telegram

  - name: Media Metadata MCP
    group: Turtle Hub
    url: "https://media-metadata-mcp.pkarpovich.space/healthz"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].tmdb == ok"
    alerts:
      - type: telegram

  - name: Obsidian MCP
    group: Turtle Hub
    url: "https://obsidian-mcp.pkarpovich.space/healthz"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
      - "[BODY].notes > 0"
    ui:
      resolve-successful-conditions: true
    alerts:
      - type: telegram

  - name: Esports
    group: Turtle Hub
    url: "https://esports.pkarpovich.space/healthz"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
      - "[BODY].pandascore == ok"
    alerts:
      - type: telegram

  - name: Omni Search
    group: Turtle Hub
    url: "https://turtle-hub.pkarpovich.space/omni-search/health"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].ok == true"
    alerts:
      - type: telegram

  - name: Content Oracle
    group: Turtle Hub
    url: "https://content-oracle.pkarpovich.space/api/health"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].message == OK"
      - "[CERTIFICATE_EXPIRATION] > 48h"
    alerts:
      - type: telegram

  - name: Content Oracle App
    group: Turtle Hub
    url: "https://content-oracle.pkarpovich.space/"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: telegram

  - name: Nikki
    group: Turtle Hub
    url: "https://nikki.pkarpovich.space/healthz"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
    alerts:
      - type: telegram

  - name: Content Collector
    group: Turtle Hub
    url: "https://apple-tv.pkarpovich.space/healthz"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
      - "[BODY].apple_tv == connected"
    alerts:
      - type: telegram

  - name: Nikki BFF
    group: Turtle Hub
    url: "http://nikki-bff:8080/healthz"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
    alerts:
      - type: telegram

  - name: Heap
    group: Turtle Hub
    url: "https://heap.pkarpovich.space/healthz"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].database == ok"
      - "[BODY].storage == ok"
    alerts:
      - type: telegram

  - name: Jackett MCP
    group: Turtle Hub
    url: "https://jackett-mcp.pkarpovich.space/healthz"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].jackett == ok"
    alerts:
      - type: telegram

  - name: Calendar
    group: Turtle Hub
    url: "https://calendar.pkarpovich.space/healthz"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
      - "[BODY].bridge == ok"
    alerts:
      - type: telegram

  - name: Reminders
    group: Turtle Hub
    url: "https://reminders.pkarpovich.space/healthz"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
      - "[BODY].bridge == ok"
    alerts:
      - type: telegram

  - name: Mail
    group: Turtle Hub
    url: "https://mail.pkarpovich.space/healthz"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
      - "[BODY].bridge == ok"
    alerts:
      - type: telegram

  - name: EventKit Bridge
    group: Turtle Hub
    url: "http://pavels-macbook-pro-2021.tailfd498.ts.net:8790/healthz"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
    alerts:
      - type: telegram

  - name: Nikki App
    group: Turtle Hub
    url: "https://nikki.pkarpovich.space/"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: telegram

  - name: Continuum Client
    group: Turtle Hub
    url: "https://continuum.pkarpovich.space/"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: telegram

  # Bit Adventure
  - name: BA Landing Page
    group: Bit Adventure
    url: "https://bit-adventure.com/api/health"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
      - "[CERTIFICATE_EXPIRATION] > 48h"
    alerts:
      - type: telegram

  - name: BA Strapi Server
    group: Bit Adventure
    url: "https://admin.bit-adventure.com/_health"
    interval: 1m
    conditions:
      - "[STATUS] == 204"
      - "[CERTIFICATE_EXPIRATION] > 48h"
    alerts:
      - type: telegram

  # External Services
  - name: Esport Syncer
    group: External
    url: "https://esport-syncer.pkarpovich.dev/health"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].events >= 50"
      - "[CERTIFICATE_EXPIRATION] > 48h"
    alerts:
      - type: telegram

  - name: Playlist Synchronizer
    group: External
    url: "https://playlist-sync.pkarpovich.dev/health"
    interval: 6m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status != failed"
      - "[BODY].ageSeconds < 7200"
      - "[CERTIFICATE_EXPIRATION] > 48h"
    alerts:
      - type: telegram

  # status is about the service (breaker open for hours, cron dead); a single tracked page
  # in trouble is the bot's message and the parked/stale counters, never this tile
  - name: Magnet Feed Sync API
    group: External
    url: "https://magnet-feed-sync.pkarpovich.space/api/health"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
      - "[CERTIFICATE_EXPIRATION] > 48h"
    alerts:
      - type: telegram

  - name: Turtle's relay (HTTP)
    group: External
    url: "https://relay.pkarpovich.space/health"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].ok == true"
      - "[CERTIFICATE_EXPIRATION] > 48h"
    alerts:
      - type: telegram

  # Turtle Bots (via watchmen endpoint)
  - name: Turtle's Magnet Feed Sync
    group: Turtle Bots
    url: "https://watchmen.pkarpovich.space/health"
    method: POST
    body: '{"username": "turtle_magnet_feed_sync_bot", "message": "/ping"}'
    headers:
      Content-Type: application/json
    interval: 1h
    conditions:
      - "[STATUS] == 200"
      - "[BODY].reply == pat(*Pong*)"
      - "[CERTIFICATE_EXPIRATION] > 48h"
    alerts:
      - type: telegram

  - name: Turtle's relay (Bot)
    group: Turtle Bots
    url: "https://watchmen.pkarpovich.space/health"
    method: POST
    body: '{"username": "turtle_relay_bot", "message": "/ping"}'
    headers:
      Content-Type: application/json
    interval: 1h
    conditions:
      - "[STATUS] == 200"
      - "[BODY].reply == pat(*Pong*)"
      - "[CERTIFICATE_EXPIRATION] > 48h"
    alerts:
      - type: telegram

  # Watchmen Service (checks Telegram connection is alive)
  - name: Watchmen Service
    group: Turtle Bots
    url: "https://watchmen.pkarpovich.space/status"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].connected == true"
      - "[CERTIFICATE_EXPIRATION] > 48h"
    alerts:
      - type: telegram
