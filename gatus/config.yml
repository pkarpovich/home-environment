ui:
  dashboard-heading: Turtle Home
  default-sort-by: group

alerting:
  telegram:
    token: ${TELEGRAM_TOKEN}
    id: ${TELEGRAM_CHAT_ID}
    default-alert:
      enabled: true
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true

external-endpoints:
  - name: Time Machine MBP-2021
    group: Backups
    token: "${TM_MBP_2021_TOKEN}"
    heartbeat:
      interval: 48h
    alerts:
      - type: telegram
        failure-threshold: 1
        success-threshold: 1

  - name: Time Machine MBA-2022
    group: Backups
    token: "${TM_MBA_2022_TOKEN}"
    heartbeat:
      interval: 48h
    alerts:
      - type: telegram
        failure-threshold: 1
        success-threshold: 1

  - name: restic-alpha
    group: Backups
    token: "${RESTIC_ALPHA_TOKEN}"
    heartbeat:
      interval: 26h
    alerts:
      - type: telegram
        failure-threshold: 1
        success-threshold: 1

  - name: restic-bravo
    group: Backups
    token: "${RESTIC_BRAVO_TOKEN}"
    heartbeat:
      interval: 26h
    alerts:
      - type: telegram
        failure-threshold: 1
        success-threshold: 1

  - name: restic-offsite
    group: Backups
    token: "${RESTIC_OFFSITE_TOKEN}"
    heartbeat:
      interval: 26h
    alerts:
      - type: telegram
        failure-threshold: 1
        success-threshold: 1

endpoints:
  # Infrastructure
  - name: Zima Pi
    group: Infrastructure
    url: "icmp://192.168.198.3"
    interval: 1m
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: telegram

  - name: pkarpovich.space DNS
    group: Infrastructure
    url: "1.1.1.1"
    interval: 5m
    dns:
      query-name: "pkarpovich.space"
      query-type: "A"
    conditions:
      - "[DNS_RCODE] == NOERROR"
    alerts:
      - type: telegram

  - name: Turtle's relay (SMTP)
    group: Infrastructure
    url: "tcp://192.168.198.3:2525"
    interval: 1m
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: telegram

  # Smart Home
  - name: Home Assistant Devices
    group: Smart Home
    url: "http://${HA_HOST}:8123/api/states/sensor.unavailable_devices_count"
    interval: 5m
    headers:
      Authorization: "Bearer ${HA_TOKEN}"
    conditions:
      - "[STATUS] == 200"
      - "[BODY].state == 0"
    alerts:
      - type: telegram

  # Local Services
  - name: Turtle Harbor Pi
    group: Local
    url: "http://192.168.198.3:9200/health"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: telegram

  - name: Live Stream Forwarder
    group: Local
    url: "http://192.168.198.3/live-stream/health"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
    alerts:
      - type: telegram

  - name: Tuclaw
    group: Local
    url: "http://192.168.199.72:9090/health"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
      - "[BODY].docker == ok"
    alerts:
      - type: telegram

  # Turtle Hub
  # The wildcard cert for *.pkarpovich.space is already asserted by the External
  # group, so these endpoints skip CERTIFICATE_EXPIRATION to avoid ten identical
  # alerts firing at once when it nears expiry.
  - name: Boosty
    group: Turtle Hub
    url: "https://boosty.pkarpovich.space/healthz"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
    alerts:
      - type: telegram

  - name: Streamcast
    group: Turtle Hub
    url: "https://streamcast.pkarpovich.space/healthz"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: telegram

  - name: Stream Recorder
    group: Turtle Hub
    url: "https://stream-recorder.pkarpovich.space/healthz"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: telegram

  - name: Twitch
    group: Turtle Hub
    url: "https://turtle-hub.pkarpovich.space/twitch/healthz"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
    alerts:
      - type: telegram

  - name: YouTube
    group: Turtle Hub
    url: "https://youtube.pkarpovich.space/healthz"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
    alerts:
      - type: telegram

  - name: Overcast
    group: Turtle Hub
    url: "https://overcast.pkarpovich.space/healthz"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
    alerts:
      - type: telegram

  - name: Obsidian MCP
    group: Turtle Hub
    url: "https://obsidian-mcp.pkarpovich.space/healthz"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
      - "[BODY].notes > 0"
    ui:
      resolve-successful-conditions: true
    alerts:
      - type: telegram

  - name: Esports
    group: Turtle Hub
    url: "https://esports.pkarpovich.space/healthz"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == ok"
    alerts:
      - type: telegram

  - name: Omni Search
    group: Turtle Hub
    url: "https://turtle-hub.pkarpovich.space/omni-search/health"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].ok == true"
    alerts:
      - type: telegram

  # Bit Adventure
  - name: BA Landing Page
    group: Bit Adventure
    url: "https://bit-adventure.com/api/health"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
      - "[CERTIFICATE_EXPIRATION] > 48h"
    alerts:
      - type: telegram

  - name: BA Strapi Server
    group: Bit Adventure
    url: "https://admin.bit-adventure.com/_health"
    interval: 1m
    conditions:
      - "[STATUS] == 204"
      - "[CERTIFICATE_EXPIRATION] > 48h"
    alerts:
      - type: telegram

  # External Services
  - name: Esport Syncer
    group: External
    url: "https://esport-syncer.pkarpovich.dev/health"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].events >= 50"
      - "[CERTIFICATE_EXPIRATION] > 48h"
    alerts:
      - type: telegram

  - name: Playlist Synchronizer
    group: External
    url: "https://playlist-sync.pkarpovich.dev/health"
    interval: 6m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status != failed"
      - "[BODY].ageSeconds < 7200"
      - "[CERTIFICATE_EXPIRATION] > 48h"
    alerts:
      - type: telegram

  - name: Content Oracle
    group: External
    url: "https://turtle-hub.pkarpovich.space/content-oracle/api/health"
    interval: 6m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].message == OK"
      - "[CERTIFICATE_EXPIRATION] > 48h"
    alerts:
      - type: telegram

  - name: Magnet Feed Sync API
    group: External
    url: "https://magnet-feed-sync.pkarpovich.space/api/health"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
      - "[BODY].failing == 0"
      - "[CERTIFICATE_EXPIRATION] > 48h"
    alerts:
      - type: telegram

  - name: Turtle's relay (HTTP)
    group: External
    url: "https://relay.pkarpovich.space/health"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].ok == true"
      - "[CERTIFICATE_EXPIRATION] > 48h"
    alerts:
      - type: telegram

  # Turtle Bots (via watchmen endpoint)
  - name: Turtle's Magnet Feed Sync
    group: Turtle Bots
    url: "https://watchmen.pkarpovich.space/health"
    method: POST
    body: '{"username": "turtle_magnet_feed_sync_bot", "message": "/ping"}'
    headers:
      Content-Type: application/json
    interval: 1h
    conditions:
      - "[STATUS] == 200"
      - "[BODY].reply == pat(*Pong*)"
      - "[CERTIFICATE_EXPIRATION] > 48h"
    alerts:
      - type: telegram

  - name: Turtle's relay (Bot)
    group: Turtle Bots
    url: "https://watchmen.pkarpovich.space/health"
    method: POST
    body: '{"username": "turtle_relay_bot", "message": "/ping"}'
    headers:
      Content-Type: application/json
    interval: 1h
    conditions:
      - "[STATUS] == 200"
      - "[BODY].reply == pat(*Pong*)"
      - "[CERTIFICATE_EXPIRATION] > 48h"
    alerts:
      - type: telegram

  # Watchmen Service (checks Telegram connection is alive)
  - name: Watchmen Service
    group: Turtle Bots
    url: "https://watchmen.pkarpovich.space/status"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].connected == true"
      - "[CERTIFICATE_EXPIRATION] > 48h"
    alerts:
      - type: telegram
